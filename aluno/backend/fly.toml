# Sapiens — app do aluno (backend). Staging público v0.1.
#
# Build a partir da RAIZ do repositório:
#     fly deploy --config aluno/backend/fly.toml --dockerfile aluno/backend/Dockerfile
#
# O Dockerfile copia `pipeline/docs/ontology/` e o validador de contratos, que
# vivem fora de `aluno/backend/` — daí o contexto na raiz.

app = "sapiens-aluno"
primary_region = "gru"          # São Paulo: menor latência para o piloto

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "INFO"
  PORT = "8000"
  # Cross-site: o frontend está no Cloudflare Pages, o backend aqui.
  COOKIE_SECURE = "true"
  COOKIE_SAMESITE = "none"
  SESSION_TTL_DAYS = "7"
  # Nunca semear dado fictício num banco que recebe aluno real.
  SEED_DEMO_DATA = "false"
  # Para onde o Mercado Pago notifica o pagamento. Não é segredo — é o
  # endereço público do nosso próprio endpoint. Fica aqui, versionado, em vez
  # de depender só do cadastro no painel do Mercado Pago.
  MERCADOPAGO_NOTIFICATION_URL = "https://sapiens-aluno.fly.dev/api/sparks/webhook"
  GEMINI_MODEL = "gemini-3-flash-preview"
  # Sincronização Firestore -> questoes_public. Explícito de propósito: a
  # máquina de desenvolvimento roda com 0 (congelamento do saneamento do
  # corpus) e produção herdava o default de 300 do código — a divergência não
  # aparecia em lugar nenhum.
  #
  # 2026-09-04 — ERA 300s, E ISSO DERRUBAVA O SITE TODO DIA. A linha antiga
  # dizia que 300s era "raro o bastante para não pressionar a cota de leitura".
  # Era o contrário, e a conta nunca tinha sido feita:
  #
  #   `admin_routes._read_all_firestore("itens")` lê o acervo INTEIRO a cada
  #   ciclo — sem detectar mudança, sem filtro incremental.
  #   268 documentos x 288 ciclos/dia = 77.184 leituras/dia.
  #   Cota gratuita do Firestore (plano Spark) = 50.000 leituras/dia.
  #
  # O laço sozinho consumia 154% da cota diária antes de qualquer aluno abrir
  # o site. Todo fim de tarde o Firestore passava a responder 429 e QUALQUER
  # rota autenticada quebrava (`ensure_student_profile` e `ler_agregado` estão
  # no caminho de quase tudo) — o aluno não conseguia responder questão nem
  # usar ferramenta nenhuma.
  #
  # 6h = 1.072 leituras/dia (2% da cota). O acervo justifica: o `updated_at`
  # mais recente dos 268 itens é de 2026-08-22, ou seja, ele passa semanas sem
  # mudar. E quando muda, o admin tem `POST /admin/firestore/sync` para
  # publicar na hora, sem esperar o ciclo.
  #
  # ARMADILHA: existe um SECRET do Fly com este mesmo nome, e secret vence o
  # `[env]` daqui. Mudar só esta linha não muda nada em produção — foi o que
  # aconteceu na primeira tentativa de corrigir o incidente. Para valer:
  #     flyctl secrets set FIRESTORE_AUTO_SYNC_SECONDS=<valor> -a sapiens-aluno
  # e confira com `flyctl ssh console -a sapiens-aluno -C "printenv ..."`.
  FIRESTORE_AUTO_SYNC_SECONDS = "21600"
  # Teto de espera das chamadas ao Gemini (ver ai_service).
  GEMINI_TIMEOUT_SEGUNDOS = "30"
  GEMINI_TIMEOUT_VISION_SEGUNDOS = "60"
  # Foto do cartão-resposta: o frontend já redimensiona, isto é a rede de
  # segurança do servidor.
  MAX_UPLOAD_MB = "8"
  # Corpus canônico dentro da imagem (ver Dockerfile).
  SAPIENS_ONTOLOGY_PATH = "/app/contracts/ontology/ontology_v1.4.json"
  SAPIENS_CONTRACTS_PATH = "/app/contracts"

[http_service]
  internal_port = 8000
  force_https = true            # o Fly termina TLS e redireciona http→https
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Uma máquina sempre de pé: `suspend` retoma em ~1s, mas manter o mínimo em 1
  # evita que o primeiro aluno do dia pague o custo de retomada.
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

# Readiness: 503 enquanto Mongo/Firestore/ontologia não responderem, para que o
# Fly não mande tráfego a uma instância que ainda não consegue atender.
[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "8s"
  path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"              # 256mb não comporta firebase-admin + google-genai
