<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <!-- `viewport-fit=cover` NÃO é enfeite: sem ele o iOS não expõe
             `env(safe-area-inset-*)`, e todo `env(safe-area-inset-bottom)` do
             `index.css` — a barra inferior do celular, o ícone flutuante da
             Mentis, o respiro do rodapé — avaliava 0px. Ou seja: a barra de
             navegação do app instalado ficava POR BAIXO da barra de gestos do
             iPhone, exatamente no aparelho em que a maioria dos alunos entra.
             O CSS estava certo desde 16/09; faltava esta palavra. -->
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <!-- A cor que o navegador do celular pinta em volta da página. Era o
             navy da marca antiga, que não é mais a cor de nenhuma superfície
             do produto: entre a barra do sistema e a barra do app havia um
             degrau azul que não existia em lugar nenhum da tela. -->
        <meta name="theme-color" content="#060c18" />
        <meta name="description" content="Plataforma de estudos para o ENEM e vestibulares que analisa os seus erros, descobre o padrão por trás deles e monta um plano de estudos personalizado, com revisão espaçada e correção de redação. Transforme seus erros em conhecimento." />
        <!-- SEO. A `description` é o texto que aparece embaixo do link no
             Google e tem ~155 caracteres úteis: ela precisa conter as palavras
             que o aluno realmente digita ("plano de estudos ENEM", "correção de
             redação") e não só o slogan da marca, que ninguém pesquisa.
             `canonical` evita que o mesmo conteúdo servido em domínio de
             preview do Cloudflare (`<hash>.sapiens-aluno.pages.dev`) concorra
             com o endereço oficial e divida a relevância entre os dois. -->
        <link rel="canonical" href="https://sapiens-aluno.pages.dev/" />
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
        <meta name="author" content="Sapiens" />

        <!-- Open Graph: sem estas tags o link colado num grupo de WhatsApp
             aparece como texto cru. Num beta que cresce por indicação entre
             alunos, isso é distribuição perdida. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Sapiens" />
        <meta property="og:locale" content="pt_BR" />
        <meta property="og:title" content="Sapiens — Plano de estudos personalizado para o ENEM e vestibular" />
        <meta property="og:description" content="Plataforma de estudos para o ENEM e vestibulares que analisa os seus erros, descobre o padrão por trás deles e monta um plano de estudos personalizado, com revisão espaçada e correção de redação. Transforme seus erros em conhecimento." />
        <meta property="og:url" content="https://sapiens-aluno.pages.dev" />
        <meta property="og:image" content="https://sapiens-aluno.pages.dev/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Sapiens — transforme seus erros em conhecimento" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Sapiens — Plano de estudos personalizado para o ENEM e vestibular" />
        <meta name="twitter:description" content="Padrões cognitivos, não notas. Cada prova vira um mapa para você evoluir." />
        <meta name="twitter:image" content="https://sapiens-aluno.pages.dev/og-image.png" />

        <link rel="manifest" href="/manifest.json" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <!-- INSTALAÇÃO NO iOS / iPadOS. O Safari nunca dispara
             `beforeinstallprompt`: quem instala o Sapiens no iPhone faz
             Compartilhar › Adicionar à Tela de Início, e é ESTE bloco que
             decide o que a pessoa recebe depois de fazer isso.

             · `apple-mobile-web-app-capable` é o que abre o app SEM a barra
               do Safari. Sem ele, o atalho na tela inicial abria uma aba
               comum — o app instalado no iPhone não era um app instalado, e
               `display: standalone` do manifest só passou a valer no iOS
               16.4. Esta meta cobre também quem está abaixo disso.
             · `status-bar-style: black-translucent` faz o conteúdo subir por
               baixo do relógio e da bateria, que é o que o
               `viewport-fit=cover` acima prepara — as duas coisas andam
               juntas ou o topo fica com uma faixa branca.
             · `apple-mobile-web-app-title` é o nome embaixo do ícone: sem
               ele o iOS usa o <title> da página.
             `mobile-web-app-capable` é a forma padronizada da primeira, e o
             Chrome já avisa no console quando ela falta. -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Sapiens" />
        <!-- O favicon é um ARQUIVO, e não mais um data URI dentro do HTML.
             A marca nova (cérebro de frente, dois hemisférios recortados e
             trilhas de circuito) tem degradê e dois `clipPath`: embutida, ela
             custava 5.5 kB no HTML — que é o documento que NUNCA é cacheado —
             e deixava o arquivo ilegível. Como arquivo, ela é baixada uma vez
             e fica no cache do navegador.
             O PNG de 192 é o `alternate icon` para quem não lê SVG na aba
             (Safari anterior ao 17): sem ele, esses navegadores caem no
             /favicon.ico que não existe e mostram uma folha em branco. -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="alternate icon" type="image/png" href="/icon-192.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>Sapiens — Plano de estudos personalizado para o ENEM e vestibular</title>
